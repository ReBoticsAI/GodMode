# Hostinger host nginx terminates TLS on :80/:443 and proxies to loopback :8080.
# Copy to docker-compose.override.yml on the VPS (gitignored). Do not fork
# docker-compose.prod.yml for port binds.
#
#   cp deploy/docker-compose.hostinger-override.example.yml \
#      deploy/docker-compose.override.yml
#
# Then always include the override (or rely on deploy/scripts which auto-load it):
#   docker compose --env-file .env.production \
#     -f docker-compose.prod.yml -f docker-compose.override.yml up -d
services:
  godmode:
    ports: !override
      - "127.0.0.1:8080:80"
