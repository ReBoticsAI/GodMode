# Layer 4 build supervisor (#164 / #167 / #170 / #112).
# Owns /var/run/docker.sock. Do NOT mount the socket into the godmode service.
# Bridge reaches this via CODING_BUILD_SUPERVISOR_URL=http://host.docker.internal:8792
# (or compose network DNS if both services share a network).
#
# Publish on 0.0.0.0 (not 127.0.0.1): on Linux, containers using
# host.docker.internal:host-gateway cannot reach ports bound only to loopback.
# Keep bearer token required; firewall WAN if the host has a public NIC.
# Egress CONNECT proxy (8793) must be reachable the same way for allowlist builds.
services:
  build-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: godmode-build-supervisor:local
    working_dir: /supervisor
    command: ["node", "server.mjs"]
    ports:
      - "8792:8792"
      - "8793:8793"
    environment:
      - CODING_BUILD_SUPERVISOR_HOST=0.0.0.0
      - CODING_BUILD_SUPERVISOR_PORT=8792
      - CODING_BUILD_SUPERVISOR_TOKEN=${CODING_BUILD_SUPERVISOR_TOKEN:?Set CODING_BUILD_SUPERVISOR_TOKEN}
      - PLATFORM_DATA_DIR=/data
      - CODING_BUILD_IMAGE=${CODING_BUILD_IMAGE:-node:22-bookworm-slim}
      - CODING_BUILD_NET=${CODING_BUILD_NET:-none}
      - CODING_BUILD_EGRESS_PROXY_HOST=0.0.0.0
      - CODING_BUILD_EGRESS_PROXY_PORT=8793
      - CODING_BUILD_EGRESS_HOSTS=${CODING_BUILD_EGRESS_HOSTS:-}
      - CODING_BUILD_EGRESS_NETWORK=${CODING_BUILD_EGRESS_NETWORK:-godmode-build-egress}
      - CODING_BUILD_GLOBAL_CONCURRENCY=${CODING_BUILD_GLOBAL_CONCURRENCY:-2}
      - CODING_BUILD_TENANT_CONCURRENCY=${CODING_BUILD_TENANT_CONCURRENCY:-1}
      - CODING_TERMINAL_EGRESS_HOSTS=${CODING_TERMINAL_EGRESS_HOSTS:-}
    volumes:
      - ./:/supervisor:ro
      - ${GODMODE_DATA_DIR:?Set GODMODE_DATA_DIR to host tenant data root}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
