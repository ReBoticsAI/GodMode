# Official multi-tenant SaaS hub (your VPS only).
# Set WEB_PUBLIC_URL, AUTH_PUBLIC_URL, and WEB_ORIGIN to the same public hostname.
#
# Layer 3: bubblewrap coding namespaces inside the container (required when SaaS
# coding is on by default, #178). Match saas-staging compose.
#
# Layer 4 (#164 / #167 / #178): do NOT mount /var/run/docker.sock here. Run the optional
# build supervisor separately (deploy/build-supervisor/) against this SaaS data dir and set
# CODING_BUILD_* in .env.production (loaded via env_file). Layer 4 supervisor: see DEPLOY.md / build-supervisor README.
#   CODING_BUILD_MODE=ephemeral
#   CODING_BUILD_SUPERVISOR_URL=http://host.docker.internal:8792
#   CODING_BUILD_SUPERVISOR_TOKEN=<shared bearer>
#   CODING_BUILD_NET=allowlist
#   # CODING_BUILD_NET=none  (no registry egress)
services:
  godmode:
    image: ${GODMODE_IMAGE:?Set GODMODE_IMAGE to an immutable ghcr.io image digest}
    ports:
      # HTTP to container nginx. For Cloudflare Full (strict), terminate TLS on the
      # host (or publish 443 with Origin CA) per deploy/cloudflare-app-edge.md.
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    env_file:
      - .env.production
    volumes:
      - godmode-data:/data
    environment:
      - PLATFORM_DATA_DIR=/data
      - DEPLOYMENT_MODE=hub
      - INSTALLATION_SURFACE=saas
      - BRIDGE_HOST=127.0.0.1
      - AUTH_ALLOW_ANONYMOUS=false
      - AUTH_ALLOW_SIGNUP=false
      # Shared host embedder + SaaS fair queue (#636 / #69). Requires host
      # llama-server --embeddings on :8082 (see DEPLOY.md).
      - EMBEDDINGS_ENABLED=true
      - EMBEDDINGS_EXTERNAL=true
      - EMBEDDINGS_SERVER_HOST=host.docker.internal
      - EMBEDDINGS_PORT=8082
      - EMBEDDINGS_QUEUE_ENABLED=true
    restart: unless-stopped

volumes:
  godmode-data:
