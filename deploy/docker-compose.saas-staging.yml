# Side-by-side SaaS staging on a host that already runs a private hub.
# Separate project name, port, and data volume — family hub stays untouched.
#
# After a release image exists:
#   GODMODE_IMAGE=ghcr.io/reboticsai/godmode@sha256:... \
#   docker compose -p godmode-saas -f docker-compose.saas-staging.yml --env-file .env.saas-staging pull
#   docker compose -p godmode-saas -f docker-compose.saas-staging.yml --env-file .env.saas-staging up -d
#
# Or build from this tree:
#   docker compose -p godmode-saas -f docker-compose.saas-staging.yml --env-file .env.saas-staging up -d --build
#
# Family hub (example): http://172.16.1.95:8080  (private_hub)
# SaaS staging:         http://172.16.1.95:9080  (saas paywall)
#
# Layer 3 (bubblewrap): SYS_ADMIN + NET_ADMIN + relaxed seccomp/apparmor so
# namespaces work inside the Bridge container (same needs as a family hub with coding).
#
# Layer 4 (#178): do NOT mount /var/run/docker.sock here. Run a sibling host
# build supervisor (deploy/build-supervisor/) against the SaaS PLATFORM_DATA_DIR
# only (separate token/data root from private_hub). Bridge reaches it via
# host.docker.internal (extra_hosts below). Example Bridge env (also in
# .env.saas-staging.example):
#   CODING_BUILD_MODE=ephemeral
#   CODING_BUILD_SUPERVISOR_URL=http://host.docker.internal:8792
#   CODING_BUILD_SUPERVISOR_TOKEN=<saas-only bearer>
#   CODING_BUILD_NET=allowlist

services:
  godmode:
    image: ${GODMODE_IMAGE:-godmode-saas-staging:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${SAAS_HOST_PORT:-9080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bubblewrap Layer 3 namespaces inside the container
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    env_file:
      - .env.saas-staging
    volumes:
      - ${SAAS_DATA_DIR:-godmode-saas-data}:/data
    environment:
      - PLATFORM_DATA_DIR=/data
      - DEPLOYMENT_MODE=hub
      - INSTALLATION_SURFACE=saas
      - BRIDGE_HOST=127.0.0.1
      - AUTH_ALLOW_ANONYMOUS=false
      - AUTH_ALLOW_SIGNUP=false
      # Shared host embedder + SaaS fair queue (#69 track C)
      - EMBEDDINGS_ENABLED=true
      - EMBEDDINGS_EXTERNAL=true
      - EMBEDDINGS_SERVER_HOST=host.docker.internal
      - EMBEDDINGS_PORT=8082
      - EMBEDDINGS_QUEUE_ENABLED=true
      # Coding / Layer 4 (values from env_file; passthrough for compose visibility)
      - CODING_TERMINAL_NET=${CODING_TERMINAL_NET:-none}
      - CODING_BUILD_MODE=${CODING_BUILD_MODE:-ephemeral}
      - CODING_BUILD_SUPERVISOR_URL=${CODING_BUILD_SUPERVISOR_URL:-http://host.docker.internal:8792}
      - CODING_BUILD_SUPERVISOR_TOKEN=${CODING_BUILD_SUPERVISOR_TOKEN:-}
      - CODING_BUILD_NET=${CODING_BUILD_NET:-allowlist}
      - CODING_BUILD_GLOBAL_CONCURRENCY=${CODING_BUILD_GLOBAL_CONCURRENCY:-2}
      - CODING_BUILD_TENANT_CONCURRENCY=${CODING_BUILD_TENANT_CONCURRENCY:-1}
      - CODING_TERMINAL_GLOBAL_CONCURRENCY=${CODING_TERMINAL_GLOBAL_CONCURRENCY:-4}
      - CODING_TERMINAL_TENANT_CONCURRENCY=${CODING_TERMINAL_TENANT_CONCURRENCY:-2}
      - CODING_PTY_MAX_PER_TENANT=${CODING_PTY_MAX_PER_TENANT:-3}
    restart: unless-stopped

volumes:
  godmode-saas-data:
